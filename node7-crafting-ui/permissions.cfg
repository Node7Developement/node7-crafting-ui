# ==============================================================================
# NODE7 CRAFTING UI - ACE PERMISSIONS
# Execute this file before ensuring node7-crafting-ui:
#
#   exec @node7-crafting-ui/permissions.cfg
#   ensure node7-crafting-ui
# ==============================================================================

# NODE7 permission object used by the server-side visual test command.
add_ace group.node7_admin node7.craftingui.test allow
add_ace group.node7_owner node7.craftingui.test allow

# Standard CFX admin compatibility.
add_ace group.admin node7.craftingui.test allow

# Explicit command ACE for installations that prefer command permissions.
add_ace group.node7_admin command.craftingtest allow
add_ace group.node7_owner command.craftingtest allow
add_ace group.admin command.craftingtest allow
